name: CI

# Two jobs that can run in parallel, plus a required gate.
#
#   web        lint, typecheck, unit tests, production build
#   database   migrations applied and the pgTAP suites run
#
# The database job deliberately does NOT use the Supabase CLI or Docker. It runs
# the real migrations and the real test files against a plain PostgreSQL service
# via scripts/verify-db.sh. That keeps the security-critical SQL testable in any
# environment and means a policy mistake fails the build in seconds rather than
# after a Docker image pulls.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. A push while a PR is open should not
# burn CI minutes re-running work whose result nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @pharmaflow/web lint

      - name: Typecheck
        run: pnpm --filter @pharmaflow/web typecheck

      - name: Unit tests
        run: pnpm --filter @pharmaflow/web test

      # The build needs these to exist, but the values are irrelevant: the build
      # compiles the code and prerenders static routes, and the authenticated
      # pages render dynamically. Nothing in the build can talk to a real
      # database, and the build must never be able to.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
          SUPABASE_SECRET_KEY: sb_secret_build_placeholder
        run: pnpm --filter @pharmaflow/web build

      # Runs last because it is the most expensive scan. A leaked key in a pull
      # request is exactly the case this exists for, and finding it after the
      # build still blocks the merge.
      - name: Secret scan
        run: make secrets

      # The client error mapper and the database's error codes are two files with
      # no other connection. A migration can raise a code the UI has no message
      # for, CI stays green, and the user sees a generic fallback -- a bug
      # invisible in English and only noticed by someone who needed the number.
      - name: Error-code drift
        run: make drift

      # The typed client is how the app calls every api.* function, so a renamed
      # argument has to be a compile error rather than a PostgREST error on a
      # stock movement in production. `make types` regenerates the file but
      # nothing forced anyone to run it; this does.
      - name: Generated types match the api schema
        run: make api-types

  # ── browser tests ─────────────────────────────────────────────────────────────
  #
  # This job exists because of a specific omission. Every product create and edit had
  # been failing in production since migration 0058 -- a missing enum cast -- and the
  # whole suite was green, because the only test that exercised that path was a
  # Playwright spec and Playwright did not run in CI.
  #
  # It runs against the Vercel preview for this commit rather than a locally started
  # app. That keeps the Supabase service key out of GitHub Actions: the preview already
  # has its own environment, and the tests drive the app through the browser exactly as
  # a person would. The cost is the deployment-protection bypass below.
  #
  # The demo delivery run is re-armed by the suite itself, through the application's
  # own warehouse-manager endpoint. Nothing here writes to the database with a
  # credential, which is the point: a pull request must not be able to run SQL against
  # the hosted project.
  #
  # Required repository secrets:
  #   VERCEL_TOKEN                 a Vercel API token with deployment read
  #   VERCEL_ORG_ID                from .vercel/project.json
  #   VERCEL_PROJECT_ID            from .vercel/project.json
  #   VERCEL_PROTECTION_BYPASS     Deployment Protection -> Bypass Protection
  e2e:
    name: Browser (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [web]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pharmaflow/web exec playwright install --with-deps chromium

      - name: Find this commit's preview deployment
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. This job needs four repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID and VERCEL_PROTECTION_BYPASS. The first three come from .vercel/project.json and the Vercel token; the bypass is generated in the dashboard under Project Settings -> Deployment Protection -> Bypass Protection."
              exit 1
            fi
          done

          sha="${{ github.event.pull_request.head.sha || github.sha }}"

          # Wait for the preview rather than failing on the first miss: the Vercel GitHub
          # app starts its build from the same push, so on a pull request this job is
          # frequently ahead of it.
          url=""
          for attempt in $(seq 1 30); do
            url="$(curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=20" \
              | python3 -c "
          import json,sys
          sha = sys.argv[1]
          for d in json.load(sys.stdin).get('deployments', []):
              meta = d.get('meta') or {}
              if meta.get('githubCommitSha') == sha and d.get('readyState') == 'READY':
                  print(d.get('url',''))
                  break
          " "$sha" || true)"

            if [ -n "$url" ]; then
              echo "preview: https://$url"
              echo "url=https://$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $attempt: no READY preview for $sha yet"
            sleep 10
          done

          echo "::error::No READY preview deployment for $sha after 5 minutes." && exit 1

      # A smoke set, not the whole suite, and the reason is arithmetic rather than
      # taste.
      #
      # The full suite is 66 tests that each load authenticated pages. Against a
      # *warm* deployment that is about six minutes. Against a preview it is every
      # first hit compiling cold, and two attempts at 20 and 35 minutes were both
      # cancelled with the suite still running. No timeout makes that honest -- it just
      # moves the number until someone spends twenty minutes of CI on it.
      #
      # So CI runs the specs that catch the failures which have actually happened, and
      # the full suite stays a local run against production. What is here and why:
      #
      #   auth          every sign-in failed once because reCAPTCHA refused a missing
      #                 token, and no other job could see it
      #   header        the account menu crashed the whole route; nothing else noticed
      #   theme         OS dark never reached half the tokens; contrast passed anyway
      #   contrast      the accessibility floor, in both modes
      #   alerts        the M5 surface, on the day it was added
      #
      # Left out, and each for a measured reason rather than a hunch:
      #
      #   navigation, screenshots   the page-heavy half -- 17 navigation tests and 13
      #                             full-page captures. Every one is a cold compile on a
      #                             preview, and together they were most of the runtime.
      #   deliveries, stocktake,   mutate demo data and need a reset before they mean
      #   catalogue-writes          anything, which is what the local run against
      #                             production is for.
      # ── the fixture ───────────────────────────────────────────────────────────
      #
      # The suite signs in against the hosted database, because a Vercel preview shares
      # the project's database and there is no isolated environment to point it at (and
      # branching is Pro-only). That used to mean production had to ship demo accounts so
      # this job had something to sign in as. It no longer does, and it should not: the
      # accounts below exist only between these two steps.
      #
      # Seeded as the service role over PostgREST rather than with a management token in
      # the job, because the token can do anything to the project and this needs to do
      # one thing.
      - name: Seed the browser fixture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. The browser job needs the project URL and the service role key so it can seed its own fixture."
              exit 1
            fi
          done
          ./scripts/ci-fixture.sh seed

      - name: Run the smoke suite
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_BYPASS_TOKEN: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          E2E_ADMIN_EMAIL: ci-admin@pharmaflow.test
          E2E_ADMIN_NAME: CI Admin
          E2E_PHARMACY_EMAIL: ci-pharmacy@pharmaflow.test
          E2E_DRIVER_EMAIL: ci-driver@pharmaflow.test
          E2E_PASSWORD: PharmaFlow#2026
          CI: true
        run: |
          # `timeout` around the run itself. A hung test otherwise holds the whole job
          # to its 35-minute ceiling with nothing in the log to say what it was waiting
          # for -- and this job has now done that twice. Fifteen minutes is roughly
          # three times the local cost of this set, so exceeding it means something is
          # stuck rather than slow, and it should say so in a minute rather than in half
          # an hour.
          timeout --signal=KILL 900 \
            pnpm --filter @pharmaflow/web exec playwright test \
              e2e/auth.spec.ts \
              e2e/header.spec.ts \
              e2e/theme.spec.ts \
              e2e/contrast.spec.ts \
              e2e/alerts.spec.ts

      # Always, including after a failure: a red build that left a tenant behind would
      # make the next one fail for a reason that has nothing to do with its diff.
      - name: Remove the browser fixture
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./scripts/ci-fixture.sh teardown || true

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  database:
    name: Database (migrations + RLS suites)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No `services:` block on purpose. scripts/verify-db.sh initialises its own
    # throwaway cluster in /tmp and tears it down afterwards, so a service
    # container would be a database nothing connects to: roughly 20 seconds of CI
    # time and a health check that proves nothing. The client tools are still
    # needed, because the script shells out to initdb/pg_ctl/psql.

    steps:
      - uses: actions/checkout@v7

      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-postgres

      # Before the suites, and reported separately. A suite that uses an
      # assertion pgTAP lacks, or a comparison whose type is inferred
      # differently, passes against the shim and fails here with a message that
      # looks like a schema bug. Naming the cause is the whole point.
      - name: Check assertion portability
        run: python3 scripts/check-assertions.py

      - name: Apply migrations and run suites
        run: ./scripts/verify-db.sh

  # Proves the isolation suites can actually fail.
  #
  # A security test that cannot fail is worse than no test, because it is reported
  # as coverage. This job removes a tenant_id check from a policy, confirms the
  # suite FAILS, and restores the file. If a future change accidentally weakens
  # a policy, or someone "fixes" a suite into always passing, this job is what
  # notices.
  #
  # Runs on pull requests as well as pushes, because that is where it earns its
  # keep: a change to a policy or to a suite is exactly the moment a guard like this
  # matters. Each job gets its own checkout, so mutating the working copy here
  # cannot affect any other job.
  #
  # It is deliberately not a required status check. It is a statement about the
  # tests rather than about the product, and it fails for reasons that are not
  # always a real regression -- a legitimately restructured policy, for instance,
  # would stop the sed matching and be reported as a broken test.
  mutation:
    name: Verify the RLS suites can fail
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-postgres

      - name: Break a policy and confirm the suite catches it
        run: |
          set -euo pipefail

          POLICY=supabase/migrations/20260101000002_identity.sql
          cp "$POLICY" /tmp/policy.backup

          # Replace the tenant scoping on the profiles read policy with a
          # deliberately wrong `true`, which is the classic RLS mistake: a policy
          # that authenticates but forgets to scope to the tenant.
          #
          # The pattern must stay in step with the migration. If someone rewrites
          # that policy, a silent no-op sed would leave the suite passing against
          # an intact policy, and this job would report "the suite is not testing
          # tenant isolation" -- a true-sounding but completely wrong conclusion.
          # So the mutation is verified before the suite is run.
          sed -i "s|using (id = (select auth.uid()));|using (true);|" "$POLICY"

          if ! grep -qF 'using (true);' "$POLICY"; then
            echo "::error::the mutation did not apply."
            echo "The sed pattern no longer matches $POLICY."
            echo "Update this job to match the current policy text."
            exit 1
          fi
          echo "--- mutation applied: ---"
          git --no-pager diff --stat -- "$POLICY" || true
          grep -nF 'using (true);' "$POLICY" | sed 's/^/    /'

          # Which assertion engine this run will use. The suites behave the same
          # either way, but the two engines report differently, so it is worth
          # knowing which produced a given result.
          echo "--- running the suite against the weakened policy (expect failure) ---"
          if ./scripts/verify-db.sh 55434 > /tmp/mutated.log 2>&1; then
            echo "::error::the RLS suite passed against a policy that leaks all profiles."
            echo "The suite is not testing tenant isolation. Refusing to pass."
            echo "--- verify-db.sh output follows ---"
            tail -40 /tmp/mutated.log
            exit 1
          fi

          echo "--- suite correctly failed. Proof from the output: ---"
          grep -nE "FAILED|not ok|cannot see|assertions" /tmp/mutated.log | head -10 || true
          echo "--- full output follows ---"
          tail -30 /tmp/mutated.log

          cp /tmp/policy.backup "$POLICY"

          # Restoring has to be verified too, or a botched restore turns the
          # second run into a third false alarm.
          if ! grep -qF 'using (id = (select auth.uid()));' "$POLICY"; then
            echo "::error::the policy was not restored correctly."
            exit 1
          fi

          echo "--- policy restored; confirming the suite passes again ---"
          ./scripts/verify-db.sh 55434 > /tmp/restored.log 2>&1 || {
            echo "::error::the suite failed after the policy was restored."
            tail -40 /tmp/restored.log
            exit 1
          }
          grep -E "assertions" /tmp/restored.log | sed 's/^/    /' || true
          echo "OK: the suites detect a broken policy and pass on a correct one."
