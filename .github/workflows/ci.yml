name: CI

# Two jobs that can run in parallel, plus a required gate.
#
#   web        lint, typecheck, unit tests, production build
#   database   migrations applied and the pgTAP suites run
#
# The database job deliberately does NOT use the Supabase CLI or Docker. It runs
# the real migrations and the real test files against a plain PostgreSQL service
# via scripts/verify-db.sh. That keeps the security-critical SQL testable in any
# environment and means a policy mistake fails the build in seconds rather than
# after a Docker image pulls.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch. A push while a PR is open should not
# burn CI minutes re-running work whose result nobody is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @pharmaflow/web lint

      - name: Typecheck
        run: pnpm --filter @pharmaflow/web typecheck

      - name: Unit tests
        run: pnpm --filter @pharmaflow/web test

      # The build needs these to exist, but the values are irrelevant: the build
      # compiles the code and prerenders static routes, and the authenticated
      # pages render dynamically. Nothing in the build can talk to a real
      # database, and the build must never be able to.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
          SUPABASE_SECRET_KEY: sb_secret_build_placeholder
        run: pnpm --filter @pharmaflow/web build

      # Runs last because it is the most expensive scan. A leaked key in a pull
      # request is exactly the case this exists for, and finding it after the
      # build still blocks the merge.
      - name: Secret scan
        run: make secrets

  database:
    name: Database (migrations + RLS suites)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No `services:` block on purpose. scripts/verify-db.sh initialises its own
    # throwaway cluster in /tmp and tears it down afterwards, so a service
    # container would be a database nothing connects to: roughly 20 seconds of CI
    # time and a health check that proves nothing. The client tools are still
    # needed, because the script shells out to initdb/pg_ctl/psql.

    steps:
      - uses: actions/checkout@v7

      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-postgres

      - name: Apply migrations and run suites
        run: ./scripts/verify-db.sh

  # Proves the isolation suites can actually fail.
  #
  # A security test that cannot fail is worse than no test, because it is reported
  # as coverage. This job removes a tenant_id check from a policy, confirms the
  # suite FAILS, and restores the file. If a future change accidentally weakens
  # a policy, or someone "fixes" a suite into always passing, this job is what
  # notices.
  #
  # It is not a required status check because it is a meta-check about the tests
  # rather than about the product, and it would fail for reasons that are not
  # always a real regression.
  mutation:
    name: Verify the RLS suites can fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Set up PostgreSQL
        uses: ./.github/actions/setup-postgres

      - name: Break a policy and confirm the suite catches it
        run: |
          set -euo pipefail

          POLICY=supabase/migrations/20260101000002_identity.sql
          cp "$POLICY" /tmp/policy.backup

          # Replace the tenant scoping on the profiles read policy with a
          # deliberately wrong `true`, which is the classic RLS mistake: a policy
          # that authenticates but forgets to scope to the tenant.
          #
          # The pattern must stay in step with the migration. If someone rewrites
          # that policy, a silent no-op sed would leave the suite passing against
          # an intact policy, and this job would report "the suite is not testing
          # tenant isolation" -- a true-sounding but completely wrong conclusion.
          # So the mutation is verified before the suite is run.
          sed -i "s|using (id = (select auth.uid()));|using (true);|" "$POLICY"

          if ! grep -qF 'using (true);' "$POLICY"; then
            echo "::error::the mutation did not apply."
            echo "The sed pattern no longer matches $POLICY."
            echo "Update this job to match the current policy text."
            exit 1
          fi
          echo "--- mutation applied: ---"
          git --no-pager diff --stat -- "$POLICY" || true
          grep -nF 'using (true);' "$POLICY" | sed 's/^/    /'

          # Which assertion engine this run will use. The suites behave the same
          # either way, but the two engines report differently, so it is worth
          # knowing which produced a given result.
          echo "--- running the suite against the weakened policy (expect failure) ---"
          if ./scripts/verify-db.sh 55434 > /tmp/mutated.log 2>&1; then
            echo "::error::the RLS suite passed against a policy that leaks all profiles."
            echo "The suite is not testing tenant isolation. Refusing to pass."
            echo "--- verify-db.sh output follows ---"
            tail -40 /tmp/mutated.log
            exit 1
          fi

          echo "--- suite correctly failed. Proof from the output: ---"
          grep -nE "FAILED|not ok|cannot see|assertions" /tmp/mutated.log | head -10 || true
          echo "--- full output follows ---"
          tail -30 /tmp/mutated.log

          cp /tmp/policy.backup "$POLICY"

          # Restoring has to be verified too, or a botched restore turns the
          # second run into a third false alarm.
          if ! grep -qF 'using (id = (select auth.uid()));' "$POLICY"; then
            echo "::error::the policy was not restored correctly."
            exit 1
          fi

          echo "--- policy restored; confirming the suite passes again ---"
          ./scripts/verify-db.sh 55434 > /tmp/restored.log 2>&1 || {
            echo "::error::the suite failed after the policy was restored."
            tail -40 /tmp/restored.log
            exit 1
          }
          grep -E "assertions" /tmp/restored.log | sed 's/^/    /' || true
          echo "OK: the suites detect a broken policy and pass on a correct one."
